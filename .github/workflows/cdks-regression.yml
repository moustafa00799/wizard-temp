name: CDKS Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build production
        run: npm run build
      - name: Start production server
        run: npm run start -- --hostname 127.0.0.1 --port 3001 > /tmp/cdks-next.log 2>&1 &
      - name: Wait for production server
        run: npx --yes wait-on http://127.0.0.1:3001
      - name: CDKS Regression Gate
        run: node scripts/ci-regression-gate.cjs
      - name: Production server log on failure
        if: failure()
        run: cat /tmp/cdks-next.log