name: CDKS Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Advisory and privacy regressions
        run: |
          npm run test:provider:schema
          npm run test:provider:fallback
          npm run test:ai:client-optin
          npm run test:cdks:debug
          npm run test:wizard:review:consent
          npm run test:i18n
          npm run test:ai:reasoning:live
          npm run test:ai:reasoning:contract
          npm run test:ai:advisory:capabilities
          npm run test:knowledge:google-drive-private
          npm run test:knowledge:gap-closure
          npm run test:campaign:lifecycle
          npm run test:campaign:lifecycle:http
          npm run test:measurement:contract
          npm run test:workspace:isolation
          npm run test:security
          npm run test:auth:local
          npm run test:blueprint:display
          npm run test:deployment:local
          CDKS_GOOGLE_DRIVE_MERGE_DATABASE=/tmp/cdks-shaaddesign-snapshot.sqlite npm run knowledge:shaaddesign:snapshot
          CDKS_GOOGLE_DRIVE_MERGE_DATABASE=/tmp/cdks-shaaddesign-snapshot.sqlite npm run test:knowledge:shaaddesign-snapshot

      - name: Start production server
        run: PORT=3001 HOSTNAME=0.0.0.0 npm run start > /tmp/cdks-next.log 2>&1 &

      - name: Wait for production server
        run: npx --yes wait-on http://127.0.0.1:3001 --timeout 60000

      - name: CDKS Regression Gate
        env:
          PORT: 3001
          HOST: 127.0.0.1
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: node scripts/ci-regression-gate.cjs

      - name: Production server log on failure
        if: failure()
        run: test -f /tmp/cdks-next.log && cat /tmp/cdks-next.log || echo "No production server log found"