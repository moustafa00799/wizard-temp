name: CDKS Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_NODE20: "true"
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Start production server
        run: PORT=3001 HOSTNAME=0.0.0.0 npm run start > /tmp/cdks-next.log 2>&1 &

      - name: Wait for production server
        run: npx --yes wait-on http://127.0.0.1:3001 --timeout 60000

      - name: CDKS Regression Gate
        env:
          PORT: 3001
          HOST: 127.0.0.1
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: node scripts/ci-regression-gate.cjs

      - name: Production server log on failure
        if: failure()
        run: cat /tmp/cdks-next.log